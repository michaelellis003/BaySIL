name: Deploy Documentation

# The API reference is generated from src/, so publishing on every merge to main
# would document functions that are not in the released package on PyPI. Deploy
# on release instead: the `release` event checks out the tag, so the published
# docs always match the released version.
#
# For manual runs, pick the release tag in the "Use workflow from" selector -
# dispatching from main would republish unreleased docs.
on:
  release:
    types: [published]
  workflow_dispatch:

# Sets permissions to allow deployment to GitHub Pages
permissions:
  contents: write

jobs:
  deploy-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup uv
        uses: ./.github/actions/setup-uv
        with:
          locked: 'false'

      - name: Deploy to GitHub Pages
        run: uv run properdocs gh-deploy --force
