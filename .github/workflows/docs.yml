name: Deploy Documentation

# Docs track main rather than releases, so they stay current between versions.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Sets permissions to allow deployment to GitHub Pages
permissions:
  contents: write

jobs:
  deploy-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup uv
        uses: ./.github/actions/setup-uv
        with:
          locked: 'false'

      - name: Deploy to GitHub Pages
        run: uv run properdocs gh-deploy --force
