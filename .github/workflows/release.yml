name: Release

# Releases are cut deliberately, not on every merge to main. Run this from the
# Actions tab when you want to ship; semantic-release still derives the version
# from the conventional commits accumulated since the last tag.
on:
  workflow_dispatch:
    inputs:
      force:
        description: >-
          Cut a release even when no commit warrants a bump. Leave on "auto"
          to let semantic-release decide from the commit history.
        required: false
        default: auto
        type: choice
        options: [auto, patch, minor, major]

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # The old workflow_run trigger was pinned to main; workflow_dispatch can be
    # started from any ref, so keep the invariant explicit — this job pushes to
    # main and must not run from anywhere else.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Gates the entire job behind manual approval: nothing is computed, tagged,
    # pushed, or published until a required reviewer approves the run.
    environment: release
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Setup uv
        uses: ./.github/actions/setup-uv

      - name: Python Semantic Release
        id: semver
        uses: python-semantic-release/python-semantic-release@39dd2052f2ce8282a5d932c31d58a2ca06d2550e  # v10.6.1
        with:
          github_token: ${{ secrets.RELEASE_TOKEN }}
          push: "false"
          vcs_release: "false"
          # Empty is an explicit no-op in the action, so "auto" maps to "".
          # Written this way round because `x == 'auto' && '' || x` would fall
          # through to the right-hand side - '' is falsy in GitHub expressions.
          force: ${{ inputs.force != 'auto' && inputs.force || '' }}

      - name: Update lockfile and push release
        if: steps.semver.outputs.released == 'true'
        run: |
          VERSION="${{ steps.semver.outputs.version }}"
          PACKAGE_NAME=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['name'])")
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          uv lock --upgrade-package "$PACKAGE_NAME"
          git add uv.lock
          git tag -d "v${VERSION}"
          git commit --amend --no-edit
          git tag "v${VERSION}"
          # --atomic so the branch and tag succeed or fail together. Without it
          # git updates refs independently, so a stale run whose main push is
          # rejected as non-fast-forward can still land the tag, leaving it
          # pointing at a commit that is not on main.
          git push --atomic origin main "v${VERSION}"

      - name: Build package
        if: steps.semver.outputs.released == 'true'
        run: uv build

      - name: Publish to PyPI
        if: steps.semver.outputs.released == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          attestations: true

      - name: Create GitHub Release
        if: steps.semver.outputs.released == 'true'
        run: gh release create "v${{ steps.semver.outputs.version }}" dist/* --generate-notes
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
